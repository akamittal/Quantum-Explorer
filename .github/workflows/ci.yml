name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests, build, bundle budget, and browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quantum engine tests
        run: npm test
      - name: Run Node backend tests
        run: npm run test --workspace=backend
      - name: Build frontend
        run: npm run build
      - name: Check JavaScript bundle budgets
        run: node scripts/check-bundle-size.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test --config frontend/playwright.config.js
      - name: Upload browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  qiskit:
    name: Qiskit service tests and JavaScript cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/qiskit/requirements.txt
      - name: Install Qiskit service dependencies
        run: python -m pip install -r services/qiskit/requirements.txt
      - name: Run Qiskit API tests
        working-directory: services/qiskit
        run: pytest -q
      - name: Start Qiskit service
        run: |
          cd services/qiskit
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/qiskit-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/qiskit-service.log
          exit 1
      - name: Cross-check JavaScript engine against Qiskit
        run: node scripts/qiskit-cross-check.mjs
