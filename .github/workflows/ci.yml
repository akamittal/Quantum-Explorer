name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests, build, bundle budget, and browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quantum engine tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check JavaScript bundle budgets
        run: node scripts/check-bundle-size.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test --config frontend/playwright.config.js
